<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12263f"/>
      <stop offset="60%" stop-color="#1b3352"/>
      <stop offset="100%" stop-color="#27466b"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e7d5b"/>
      <stop offset="100%" stop-color="#1e5a40"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4b96a"/>
      <stop offset="100%" stop-color="#a8842c"/>
    </linearGradient>
  </defs>

  <!-- Cielo -->
  <rect width="640" height="540" fill="url(#sky)"/>

  <!-- Sol / aura dorada -->
  <circle cx="500" cy="130" r="60" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="500" cy="130" r="90" fill="#d4b96a" opacity="0.12"/>

  <!-- Montañas lejanas -->
  <path d="M0,400 L120,300 L230,360 L340,280 L470,370 L560,310 L640,360 L640,540 L0,540 Z" fill="#0c1a2e" opacity="0.55"/>

  <!-- Montaña principal nevada -->
  <path d="M180,400 L330,240 L480,400 Z" fill="#12263f"/>
  <path d="M330,240 L382,300 L330,312 L308,286 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Colinas verdes -->
  <path d="M0,430 Q160,360 320,430 T640,420 L640,540 L0,540 Z" fill="url(#hill)"/>

  <!-- Edificio principal -->
  <g>
    <rect x="240" y="330" width="160" height="120" rx="4" fill="#faf8f3"/>
    <rect x="240" y="330" width="160" height="14" fill="#a8842c"/>
    <!-- Ventanas -->
    <g fill="#12263f">
      <rect x="252" y="356" width="20" height="26" rx="2"/>
      <rect x="284" y="356" width="20" height="26" rx="2"/>
      <rect x="316" y="356" width="20" height="26" rx="2"/>
      <rect x="348" y="356" width="20" height="26" rx="2"/>
      <rect x="252" y="396" width="20" height="26" rx="2"/>
      <rect x="284" y="396" width="20" height="26" rx="2"/>
      <rect x="316" y="396" width="20" height="26" rx="2"/>
      <rect x="348" y="396" width="20" height="26" rx="2"/>
    </g>
    <!-- Puerta -->
    <rect x="304" y="414" width="32" height="36" rx="16 16 0 0" fill="#a8842c"/>
    <!-- Torre -->
    <rect x="308" y="286" width="24" height="50" fill="#f4f0e6"/>
    <rect x="300" y="278" width="40" height="14" rx="2" fill="#1b3352"/>
    <rect x="312" y="264" width="16" height="16" fill="#d4b96a"/>
  </g>

  <!-- Árboles -->
  <g fill="#0c1a2e" opacity="0.7">
    <path d="M90,470 L110,420 L130,470 Z"/>
    <path d="M130,475 L150,428 L170,475 Z"/>
    <path d="M510,465 L530,412 L550,465 Z"/>
    <path d="M555,470 L573,424 L591,470 Z"/>
  </g>

  <!-- Bandera dorada -->
  <line x1="588" y1="278" x2="588" y2="330" stroke="#0c1a2e" stroke-width="3"/>
  <path d="M588,278 L610,285 L588,294 Z" fill="#d4b96a"/>
</svg>
